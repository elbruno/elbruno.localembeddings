name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (leave empty to use csproj version)"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Required for OIDC token exchange with NuGet
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Strip leading 'v' from tag, then any stray leading dot.
            # Handles both v1.2.3 and v.1.2.3 (common tagging mistake).
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"   # strip leading v  (v1.2.3 → 1.2.3)
            VERSION="${VERSION#.}"   # strip stray dot  (.1.2.3 → 1.2.3)
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            # Read from csproj
            VERSION=$(grep -oP '<Version>\K[^<]+' src/ElBruno.LocalEmbeddings/ElBruno.LocalEmbeddings.csproj)
          fi
          # Validate: must match MAJOR.MINOR.PATCH (with optional pre-release suffix)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "❌ Invalid version string: '$VERSION'"
            echo "   Tag must be v1.2.3 or v.1.2.3 — not '${{ github.event.release.tag_name }}'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Publishing version: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Validate README What's New policy
        run: |
          SECTION=$(awk '/^## .*What'"'"'s New/{flag=1;next}/^## /{flag=0}flag{print}' README.md)
          if [[ -z "$SECTION" ]]; then
            echo "❌ README.md must contain a What's New section."
            exit 1
          fi

          BULLET_COUNT=$(printf "%s\n" "$SECTION" | grep -E '^- ' | wc -l | xargs)
          TABLE_COUNT=$(printf "%s\n" "$SECTION" | grep -E '^\| \*\*v' | wc -l | xargs)
          ITEM_COUNT="$BULLET_COUNT"
          if [[ "$TABLE_COUNT" -gt "$ITEM_COUNT" ]]; then
            ITEM_COUNT="$TABLE_COUNT"
          fi

          if [[ "$ITEM_COUNT" -ne 5 ]]; then
            echo "❌ What's New must keep exactly the last 5 notable entries. Found: $ITEM_COUNT"
            exit 1
          fi

          echo "✅ README What's New policy passed (5 entries)."

      - name: Pack
        run: |
          dotnet pack src/ElBruno.LocalEmbeddings/ElBruno.LocalEmbeddings.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/ElBruno.LocalEmbeddings.Harrier/ElBruno.LocalEmbeddings.Harrier.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/ElBruno.LocalEmbeddings.ImageEmbeddings/ElBruno.LocalEmbeddings.ImageEmbeddings.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/ElBruno.LocalEmbeddings.ImageEmbeddings.Downloader/ElBruno.LocalEmbeddings.ImageEmbeddings.Downloader.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/ElBruno.LocalEmbeddings.KernelMemory/ElBruno.LocalEmbeddings.KernelMemory.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/ElBruno.LocalEmbeddings.VectorData/ElBruno.LocalEmbeddings.VectorData.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/ElBruno.LocalEmbeddings.Azure/ElBruno.LocalEmbeddings.Azure.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/ElBruno.LocalEmbeddings.OpenTelemetry/ElBruno.LocalEmbeddings.OpenTelemetry.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/ElBruno.LocalEmbeddings.Npu/ElBruno.LocalEmbeddings.Npu.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/ElBruno.LocalEmbeddings.Npu.Intel/ElBruno.LocalEmbeddings.Npu.Intel.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/ElBruno.LocalEmbeddings.Npu.Qualcomm/ElBruno.LocalEmbeddings.Npu.Qualcomm.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/ElBruno.LocalEmbeddings.BlazorComponents/ElBruno.LocalEmbeddings.BlazorComponents.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
